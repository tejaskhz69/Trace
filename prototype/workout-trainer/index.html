<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trace workout-trainer prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<p class="banner" role="note" id="banner">Prototype — sample data only. This screen is not connected to Trace.</p>

<div class="shell">

  <header class="masthead">
    <div>
      <p class="label">Prototype · Trainer</p>
      <p class="wordmark">Trace</p>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <p class="clock num">Mon 25 Aug · 07:12</p>
      <button class="avatar" data-action="goto" data-target="profile" aria-label="Profile and settings">SM</button>
    </div>
  </header>

  <!-- Every screen is rendered by app.js into its own section. The sections
       exist here so each one owns a stable id, a role and a label. -->
  <main>
    <section class="screen" id="screen-home"        role="tabpanel" aria-label="Home"                          tabindex="-1"></section>
    <section class="screen" id="screen-train"       role="tabpanel" aria-label="Today's workout"               tabindex="-1" hidden></section>
    <section class="screen" id="screen-exercise"    role="tabpanel" aria-label="Exercise detail"               tabindex="-1" hidden></section>
    <section class="screen" id="screen-summary"     role="tabpanel" aria-label="Session summary"               tabindex="-1" hidden></section>
    <section class="screen" id="screen-independent" role="tabpanel" aria-label="Log an independent workout"    tabindex="-1" hidden></section>
    <section class="screen" id="screen-recover"     role="tabpanel" aria-label="Recovery"                      tabindex="-1" hidden></section>
    <section class="screen" id="screen-sleep"       role="tabpanel" aria-label="Sleep detail"                  tabindex="-1" hidden></section>
    <section class="screen" id="screen-cardio"      role="tabpanel" aria-label="Cardio"                        tabindex="-1" hidden></section>
    <section class="screen" id="screen-ride"        role="tabpanel" aria-label="Cycling detail"                tabindex="-1" hidden></section>
    <section class="screen" id="screen-eat"         role="tabpanel" aria-label="Nutrition"                     tabindex="-1" hidden></section>
    <section class="screen" id="screen-progress"    role="tabpanel" aria-label="Progress"                      tabindex="-1" hidden></section>
    <section class="screen" id="screen-ai"          role="tabpanel" aria-label="AI trainer review"             tabindex="-1" hidden></section>
    <section class="screen" id="screen-setup"       role="tabpanel" aria-label="Programme and goal setup"      tabindex="-1" hidden></section>
    <section class="screen" id="screen-profile"     role="tabpanel" aria-label="Profile"                       tabindex="-1" hidden></section>
  </main>

</div>

<!-- Six tabs. Profile and setup live behind the masthead avatar, which is
     the pattern the Flight Deck reference uses for settings. -->
<nav class="tabbar" role="tablist" aria-label="Sections" id="tabbar"></nav>

<div class="scrim" id="sheet-scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div id="sheet-content"></div>
  </div>
</div>

<div class="scrim centred" id="dialog-scrim" hidden>
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-body" id="dialog">
    <div id="dialog-content"></div>
  </div>
</div>

<div class="toast-rail" id="toast-rail" aria-live="polite" aria-atomic="false"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
