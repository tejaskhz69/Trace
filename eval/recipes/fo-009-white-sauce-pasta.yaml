# fo-009 -- homemade white-sauce pasta (paneer-curd base)
#
# WHY THIS ROW MATTERS
# The white sauce here is blended paneer + curd, not cream or bechamel.
# A vision model sees "pasta in white sauce" and reaches for the cream
# prior: ~300-400 kcal/100 ml, 30 g+ fat. The real sauce is 348 kcal in
# ~130 g of sauce, and most of that is protein, not fat. This is the
# pre-registered headline failure case for the whole eval set.
#
# It is also an unusually clean row: the cooking oil is 7 sprays from a
# mister, so the oil uncertainty is +/-4 kcal on a ~1000-1850 kcal batch
# (0.2-0.4%). Almost every other Indian dish has the opposite problem.
#
# STATUS 2026-08-27: two of three conflicts RESOLVED, one still open.
#
#   1. DRY vs COOKED -- RESOLVED: COOKED. I called this dry from a thumbnail
#      and was wrong. At full resolution the penne is swollen, glossy and
#      translucent at the edges, sitting in visible moisture on the plate.
#      Dry penne is chalky-matte with square-cut ends. Bowl was tared, so
#      399 g is pasta alone.
#   2. PORTION -- RESOLVED: whole batch, one bowl. This is consistent with
#      (1): 399 g cooked plus sauce and cheese is ~600 g, which fits the
#      bowl. It is 399 g DRY that could not have fitted, which is what made
#      the two claims look contradictory.
#   3. CHEESE -- brand identified (D'lecta mozzarella, 284 kcal/100 g),
#      WEIGHT still open. Two handfuls, unweighed. At 50-70 g that is
#      142-199 kcal, i.e. 12-17% of the dish -- far too large to wave
#      through on a recipe-tier row. Weigh two handfuls onto the scale.
#
# Masala: one whole 6 g sachet, which is what was already computed. No change.
dish: "Homemade white sauce pasta (paneer-curd sauce)"
cuisine: western
truth_source: recipe
hidden_fat: med

# --- the part that is fully determined -------------------------------
ingredients:
  - name: "Paneer, full fat"
    grams: 100
    per100g: {kcal: 296, protein: 18.3, carbs: 6.1, fat: 22.8}
    source: "IFCT 2017, paneer (whole milk)"
  - name: "Curd / dahi, whole milk"
    grams: 28            # 25-30 ml, density ~1.03
    per100g: {kcal: 60, protein: 3.1, carbs: 4.7, fat: 4.0}
    source: "IFCT 2017, dahi (whole milk)"
  - name: "Garlic, 3 cloves"
    grams: 9             # 2 in sauce + 1 in the stir-fry
    per100g: {kcal: 149, protein: 6.4, carbs: 33.1, fat: 0.5}
    source: "USDA 11215"
  - name: "Red onion, half a head"
    grams: 55
    per100g: {kcal: 40, protein: 1.1, carbs: 9.3, fat: 0.1}
    source: "USDA 11282"
  - name: "D'lecta mozzarella, two handfuls"
    grams: null          # <-- BLOCKING. Weigh two handfuls onto the scale.
    grams_low: 50
    grams_high: 70
    per100g: {kcal: 284, protein: 24.5, carbs: 0.5, fat: 20.5}
    source: "FatSecret India, D'lecta Mozzarella. CROWDSOURCED, not a panel --
      one tier below the masala figure, which came off the packet itself.
      Photograph the D'lecta panel and replace this to make the row fully
      label-backed. Note: if it is actually D'lecta processed cheese and not
      mozzarella, figures differ -- check which one is in the fridge."
  - name: "Maggi Masala-ae-Magic, 1 sachet"
    grams: 6
    per100g: {kcal: 166, protein: 5.0, carbs: 30.0, fat: 1.5}
    source: "PANEL PHOTOGRAPHED 2026-08 -- 166 kcal/100 g, net qty 6 g, 3 serves of 2 g"

# --- the part that needs one measurement -----------------------------
oil:
  name: "Olive oil, 7 sprays"
  per100g: {kcal: 884, protein: 0, carbs: 0, fat: 100}
  # Glass mister bottle (photographed). Until it is measured, carry the
  # band rather than a point value.
  grams_low: 0.6         # fine mist, weak pump
  grams_typical: 1.0
  grams_high: 1.6        # coarse spray
  measure_protocol: |
    NOT NEEDED FOR THIS ROW. The full oil band is 9 kcal against a 999 kcal
    plate -- 0.9%. Using the typical value carries +/-5 kcal of residual
    error, which is far inside the noise of everything else here.

    When it DOES matter (any pan-fried dish), use the graduation method --
    no scale, no teaspoon, 30 seconds:
      1. Fill the bottle to a printed line.
      2. Spray 50 times into the sink, counting.
      3. Read the new level. Drop in ml / 50 = ml per spray.
      4. x 0.92 g/ml x 8.84 kcal/g = kcal per spray. Permanent constant.
    Water works for step 2 if you would rather not waste oil: a pump
    sprayer meters a fixed chamber volume per stroke, so water and oil
    displace nearly the same volume even though the mist looks different.

    Do NOT take ml-per-spray from an Amazon listing. No listing states it,
    and pump output varies with fill level, temperature and pump wear.

# --- the part that is a fork -----------------------------------------
pasta:
  grams: 400
  dry:    {kcal: 371, protein: 13.0, carbs: 74.7, fat: 1.5}   # durum semolina, USDA 20099
  cooked: {kcal: 158, protein: 5.8,  carbs: 30.9, fat: 0.9}   # USDA 20121
  state: cooked        # CONFIRMED by prep photo at full resolution

plate_fraction: 1.0      # CONFIRMED -- whole batch, single bowl

prediction:
  # REVISED 2026-08-27, and weakened. The original prediction was that a model
  # would over-estimate by mistaking a paneer-curd sauce for cream. With ~60 g
  # of real melted cheese in the dish that trap is half-sprung: a model reading
  # "cheesy pasta" is now partly RIGHT, so a close estimate no longer tells us
  # whether it understood the sauce or just pattern-matched the colour.
  #
  # The row is still worth scoring, but it is no longer the headline
  # failure case. A clean version of that test needs a dish where the white
  # sauce is genuinely paneer-and-curd with no cheese at all -- worth cooking
  # once deliberately, with everything weighed.
  expect: over
  reason: "cream prior on a paneer-curd base, partly offset by real cheese"
  magnitude: "+10% to +35% -- widened, and less diagnostic than before"
