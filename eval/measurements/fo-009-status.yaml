# ---------------------------------------------------------------------------
# THE RE-COOK PROCEDURE
#
# This converts fo-009 from a blocked row into a clean recipe-tier row. Every
# line is a weighing. Nothing below is optional -- the reason this row is
# blocked is that three of these were skipped the first time.
recook_procedure:
  before_cooking:
    - "Tare the bowl. Weigh DRY pasta into it. Record grams."
    - "Weigh the butter before it goes in the pan. Record grams."
    - "Weigh the flour. Record grams."
    - "Weigh the milk (tare a jug, pour, record). Millilitres are not grams."
    - "Weigh the cheese. Not a handful -- the scale. Photograph its panel."
    - "Weigh the masala sachet, or photograph its panel if sealed."
    - "Weigh any oil, or if sprayed, COUNT the sprays (0.15 g each)."
  after_cooking:
    - "Weigh the whole pot, tared. This is the batch total."
    - "Weigh the served portion, tared. This gives plate_fraction honestly."
    - "Photograph the plated portion the way a user would -- one shot, phone
       held naturally, whatever light you are eating in."
  then:
    - "truth_kcal = sum of weighed inputs x their panels, x plate_fraction."
    - "Every input either has a panel or a USDA figure. No handfuls."
  estimated_effort: "About four extra minutes over cooking it normally."

